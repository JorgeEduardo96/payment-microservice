# NodePort (not ClusterIP): with no api-gateway deployed in this cluster,
# the frontend (or any external client) needs to reach client-service
# directly. On minikube with the Docker driver, NodePort itself isn't
# reachable from the host without a tunnel — use:
#   kubectl port-forward svc/client-service 8081:8081
# Internal DNS name (used by other pods, e.g. future service-to-service
# calls) remains client-service.default.svc.cluster.local:8081.
apiVersion: v1
kind: Service
metadata:
  name: client-service
  labels:
    app: client-service
spec:
  type: NodePort
  selector:
    app: client-service
  ports:
    - port: 8081
      targetPort: 8081
      name: http
