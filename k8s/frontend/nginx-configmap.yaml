# Overrides frontend's built-in nginx.conf (baked into the image at build time for
# docker-compose, where it proxies to api-gateway:8080) with a K8s-specific variant that
# routes directly to each service's own Kubernetes Service DNS name — there's no
# api-gateway deployed in this cluster. Mounted over /etc/nginx/conf.d/default.conf in
# k8s/frontend/deployment.yaml.
#
# Apply with:
#   kubectl apply -f k8s/frontend/nginx-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Kubernetes' CoreDNS (kube-dns Service ClusterIP) — resolves upstream hostnames
        # per-request instead of once at startup, so nginx doesn't crash-loop if a
        # backend isn't up yet. Confirm on your cluster with:
        #   kubectl get svc -n kube-system kube-dns
        resolver 10.96.0.10 valid=10s;

        # No api-gateway in this cluster: each service is called directly via its own
        # Kubernetes Service DNS name (see k8s/<service>/service.yaml). JWT validation
        # now happens in each service itself (client-service/order-service have their
        # own SecurityConfig; notification-service validates at the STOMP CONNECT frame).
        #
        # NOTE: nginx's `resolver` directive does NOT honor /etc/resolv.conf's `search`
        # domains the way a normal libc resolver does — it only resolves the exact name
        # given. Short names like "client-service" NXDOMAIN against CoreDNS; the fully
        # qualified in-cluster name (<service>.<namespace>.svc.cluster.local) is required.
        location ~ ^/client($|/) {
            set $upstream http://client-service.default.svc.cluster.local:8081;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location ~ ^/order($|/) {
            set $upstream http://order-service.default.svc.cluster.local:8082;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /ws-notifications {
            set $upstream http://notification-service.default.svc.cluster.local:8084;
            proxy_pass $upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # SPA fallback for Vue Router history mode.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
