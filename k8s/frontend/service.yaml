# NodePort (not ClusterIP): the browser needs to reach the frontend directly — there's
# no Ingress in this cluster. On minikube with the Docker driver, NodePort itself isn't
# reachable from the host without a tunnel — use:
#   kubectl port-forward svc/frontend 8000:80
# (8000 mirrors docker-compose's host port mapping for consistency.)
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      name: http
