# Keycloak Service — ClusterIP for internal use by client-service and (later)
# api-gateway-less direct calls, plus we still want browser access to the
# admin console for realm management, so we also expose it via NodePort
# (same pattern as zipkin/prometheus/grafana — reached via
# `kubectl port-forward svc/keycloak 8180:8080`).
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    app: keycloak
spec:
  type: NodePort
  selector:
    app: keycloak
  ports:
    - port: 8080
      targetPort: 8080
      name: http
