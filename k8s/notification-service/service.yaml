# NodePort (not ClusterIP): the frontend needs to open a WebSocket connection to
# /ws-notifications directly (no api-gateway in this cluster). On minikube with the
# Docker driver, NodePort itself isn't reachable from the host without a tunnel — use:
#   kubectl port-forward svc/notification-service 8084:8084
# Internal DNS name (used by other pods) remains
# notification-service.default.svc.cluster.local:8084.
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  labels:
    app: notification-service
spec:
  type: NodePort
  selector:
    app: notification-service
  ports:
    - port: 8084
      targetPort: 8084
      name: http
