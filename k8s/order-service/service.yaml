# NodePort (not ClusterIP): with no api-gateway deployed in this cluster,
# the frontend (or any external client) needs to reach order-service
# directly. On minikube with the Docker driver, NodePort itself isn't
# reachable from the host without a tunnel — use:
#   kubectl port-forward svc/order-service 8082:8082
# Internal DNS name (used by other pods) remains order-service.default.svc.cluster.local:8082.
apiVersion: v1
kind: Service
metadata:
  name: order-service
  labels:
    app: order-service
spec:
  type: NodePort
  selector:
    app: order-service
  ports:
    - port: 8082
      targetPort: 8082
      name: http
