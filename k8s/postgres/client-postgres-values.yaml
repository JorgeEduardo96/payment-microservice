# Bitnami PostgreSQL chart values for client-service's database.
# Install with:
#   helm install client-postgres bitnami/postgresql -f k8s/postgres/client-postgres-values.yaml --version 18.8.13
#
# NOTE: we do NOT pin image.tag — see order-postgres-values.yaml for why
# (Bitnami free tier only ships "latest" now; our SQL is plain ANSI so the
# Postgres major version doesn't matter here).

auth:
  username: client_service
  password: client_service
  database: clientdb
  postgresPassword: postgres

primary:
  persistence:
    size: 1Gi
  resourcesPreset: "nano"

readReplicas:
  replicaCount: 0
