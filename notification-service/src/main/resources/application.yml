spring:
  application:
    name: notification-service
  kafka:
    bootstrap-servers: localhost:19092
  datasource:
    url: jdbc:postgresql://localhost:5436/notificationdb
    driver-class-name: org.postgresql.Driver
    username: notification_service
    password: notification_service
  jpa:
    hibernate:
      ddl-auto: none
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8084

app:
  security:
    issuer-uri: http://localhost:8180/realms/payment-microservice
    jwk-set-uri: http://localhost:8180/realms/payment-microservice/protocol/openid-connect/certs

logging:
  pattern:
    level: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{traceId:-},%X{spanId:-}] %5p %c - %m%n"

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

notification-service:
  notification:
    notification-type: email
  sendgrid:
    api-key: ${SENDGRID_API_KEY:CREATE_ENV_VARIABLES}
    from-email: ${SENDGRID_FROM_EMAIL:CREATE_ENV_VARIABLES}
    from-name: ${SENDGRID_FROM_NAME:CREATE_ENV_VARIABLES}
