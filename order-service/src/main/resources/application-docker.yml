spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://order-postgres:5432/orderdb
    driver-class-name: org.postgresql.Driver
    username: order_service
    password: order_service
  jpa:
    hibernate:
      ddl-auto: none
  kafka:
    bootstrap-servers: kafka:9092
    consumer:
      group-id: order-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 1
    listener:
      ack-mode: record
      concurrency: 1
      missing-topics-fatal: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      retries: 3
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
server:
  port: 8082
app:
  security:
    # The frontend/browser talks to Keycloak via localhost:8180, so tokens carry that as
    # the issuer. Inside Docker, this service must fetch signing keys via the internal
    # hostname instead — see SecurityConfig for how the two are reconciled.
    issuer-uri: http://localhost:8180/realms/payment-microservice
    jwk-set-uri: http://keycloak:8080/realms/payment-microservice/protocol/openid-connect/certs
logging:
  pattern:
    level: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{traceId:-},%X{spanId:-}] %5p %c - %m%n"
grpc:
  server:
    port: -1
  client:
    payment-service:
      negotiation-type: plaintext
eureka:
  client:
    service-url:
      defaultZone: http://service-registry:8761/eureka/
