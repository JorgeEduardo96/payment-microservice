spring:
  application:
    name: order-service
  kafka:
    bootstrap-servers: localhost:19092
  datasource:
    url: jdbc:h2:file:./data/orderdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
  h2:
    console:
      enabled: true
      path: /h2-console
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
server:
  port: 8082
logging:
  pattern:
    level: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{traceId:-},%X{spanId:-}] %5p %c - %m%n"
grpc:
  server:
    port: -1
  client:
    payment-service:
      negotiation-type: plaintext
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

resilience4j:
  retry:
    instances:
      payment:
        max-attempts: 3
        wait-duration: 2s
        retry-exceptions:
          - io.grpc.StatusRuntimeException
        ignore-exceptions:
          - java.lang.IllegalArgumentException
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2.0

order-service:
  saga:
    # How long a saga can sit in PAYMENT_REQUESTED before it's considered stuck
    # (e.g. the payment-topic Kafka event never arrived) and gets compensated.
    timeout-minutes: 5
    # How often the timeout job scans for stuck sagas.
    check-interval-ms: 60000
    # Max compensation attempts before a saga is marked FAILED (terminal, needs
    # manual intervention) instead of being retried forever.
    max-compensation-retries: 3

