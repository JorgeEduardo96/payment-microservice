spring:
  application:
    name: payment-service
  kafka:
    # Service name from the "kafka" Bitnami Kafka release (see k8s/kafka/kafka-values.yaml).
    bootstrap-servers: kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
  datasource:
    # Bitnami postgresql chart names its Service "<release-name>-postgresql";
    # our release is "payment-postgres" (see k8s/postgres/payment-postgres-values.yaml).
    url: jdbc:postgresql://payment-postgres-postgresql:5432/paymentdb
    driver-class-name: org.postgresql.Driver
    username: payment_service
    password: payment_service
  jpa:
    hibernate:
      ddl-auto: none
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

grpc:
  server:
    port: 9090

server:
  port: 8083

logging:
  pattern:
    level: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{traceId:-},%X{spanId:-}] %5p %c - %m%n"

management:
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: b3
  zipkin:
    tracing:
      # Same Service name as docker-compose's zipkin container (see k8s/zipkin/service.yaml).
      endpoint: http://zipkin:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
  endpoint:
    health:
      show-details: always
  health:
    diskSpace:
      enabled: false

eureka:
  client:
    enabled: false

payment-service:
  outbox:
    retry-delay-ms: 43200000
